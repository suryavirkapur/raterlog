# Everything boots from the single top-level Dockerfile: one image runs
# PostgreSQL, Cassandra, MailHog, the Rust API and the TanStack web app.
services:
  raterlog:
    build:
      context: .
      dockerfile: Dockerfile
    image: raterlog
    container_name: raterlog
    ports:
      - "3000:3000" # web dashboard
      - "8080:8080" # Rust log-ingestion API
      - "8025:8025" # MailHog UI
    volumes:
      - pgdata:/var/lib/postgresql/data
      - cassandra-data:/var/lib/cassandra
    restart: unless-stopped

volumes:
  pgdata:
  cassandra-data:
