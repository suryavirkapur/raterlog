services:

  cassandra:
    image: cassandra:latest
    container_name: cassandra-container
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_USER=admin
      - CASSANDRA_PASSWORD=admin
    volumes:
      - cassandra-data:/var/lib/cassandra

  kong:
    build:
      context: ./kong
      dockerfile: Dockerfile
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
    ports:
      - "8000:8000"
      - "8443:8443"
      - "8001:8001"
      - "8444:8444"
    depends_on:
      - rust-api

  nextjs-app:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - rust-api

  rust-api:
    restart: unless-stopped
    depends_on:
      - cassandra
      - postgres
      - mailhog
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      RUST_LOG: info
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/example
      CASSANDRA_URI: cassandra:9042
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_URL: http://localhost:3000
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      COOKIE_SECURE: "false"
      HTTP_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=example
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  cassandra-data:
  pgdata:
