_format_version: "2.1"
_transform: true

services:
  - name: rust-api
    url: http://rust-api:8080
    routes:
      - name: api-route
        paths:
          - /api
          - /v1
          - /log
          - /health
        strip_path: false

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - Cookie
        - X-Session-Token
      credentials: true
      max_age: 3600

  - name: rate-limiting
    config:
      minute: 100
      policy: local
