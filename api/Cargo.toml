[package]
name = "raterlog"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.7"
actix-web = { version = "4", default-features = false, features = ["macros", "cookies", "compress-gzip", "compress-brotli", "compress-zstd", "unicode", "compat"] }
argon2 = "0.5"
base64ct = { version = "1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hmac = "0.12"
mime_guess = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
